services:
  db:
    image: postgres:16-alpine
    container_name: classreminer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classreminer}
      POSTGRES_USER: ${POSTGRES_USER:-classreminer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classreminer}
      # Persian text sorts correctly only if the database is UTF-8.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in here runs once, in filename order, on an empty data volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classreminer} -d ${POSTGRES_DB:-classreminer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A browser-based database GUI, for local use.
  # Open http://localhost:8080 once both containers are up.
  # This is a development convenience — see docs/DATABASE.md before putting it
  # on a public server, and delete this service if you would rather use a
  # desktop client such as TablePlus or DBeaver.
  adminer:
    image: adminer:4.8.1
    container_name: classreminer-adminer
    restart: unless-stopped
    environment:
      # Pre-fills the "server" box so you only type the password.
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      # Bound to 127.0.0.1 so it is reachable from this machine only.
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
